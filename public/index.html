  <!-- ===== Auth ===== -->
  <!-- ===== Public landing page ===== -->
  <div id="landing" class="landing" hidden>
    <header class="lp-nav">
      <a class="lp-mark" href="#home" data-lp="home">ZAJEL</a>
      <nav class="lp-links">
        <a href="#home" data-lp="home" data-i18n="lpHome"></a>
        <a href="#features" data-lp="features" data-i18n="lpFeatures"></a>
        <a href="#pricing" data-lp="pricing" data-i18n="lpPricing"></a>
        <a href="#contact" data-lp="contact" data-i18n="lpContact"></a>
      </nav>
      <div class="lp-right">
        <button type="button" class="lp-lang" data-lang-toggle><span></span></button>
        <button type="button" class="lp-signin" data-signin data-i18n="signIn"></button>
      </div>
    </header>

    <section class="lp-hero" id="lp-home">
      <h1 class="lp-word">ZAJEL</h1>
      <p class="lp-tag" data-i18n="lpTagline"></p>
      <p class="lp-sub" data-i18n="lpSub"></p>
      <div class="lp-cta">
        <button type="button" class="lp-btn primary" data-signin data-i18n="lpStart"></button>
        <a class="lp-btn" href="#features" data-lp="features" data-i18n="lpSee"></a>
      </div>
      <div class="lp-say" aria-hidden="true">
        <span class="lp-orb"><svg class="ic"><use href="#i-mic"/></svg></span>
        <span class="lp-say-text" id="lp-say-text"></span>
      </div>
    </section>

    <section class="lp-section" id="lp-features">
      <h2 data-i18n="lpFeaturesTitle"></h2>
      <p class="lp-lead" data-i18n="lpFeaturesLead"></p>
      <div class="lp-grid" id="lp-feature-grid"></div>
    </section>

    <section class="lp-section" id="lp-pricing">
      <h2 data-i18n="lpPricingTitle"></h2>
      <div class="lp-prices" id="lp-prices"></div>
    </section>

    <section class="lp-section" id="lp-contact">
      <h2 data-i18n="lpContactTitle"></h2>
      <p class="lp-lead" data-i18n="lpContactLead"></p>
      <div id="lp-contact-body"></div>
    </section>

    <footer class="lp-foot"><span>© 2026 Zajel · زاجل</span><button type="button" class="lp-link" data-signin data-i18n="signIn"></button></footer>
  </div>

  <section id="auth" class="auth" hidden>
    <div class="auth-hero">
      <div class="brand"><img src="/icon.svg" alt="" width="40" height="40" /><span data-i18n="brand"></span></div>
      <div class="hero-copy">
        <h1 data-i18n="heroTitle"></h1>
        <p data-i18n="heroText"></p>
        <div class="hero-demo">
          <div class="bubble me" data-i18n="heroDemoMe"></div>
          <div class="bubble mudir"><svg class="ic"><use href="#i-sparkle"/></svg><span data-i18n="heroDemoZajel"></span></div>
        </div>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-top"><button type="button" class="lang-btn" data-back-landing><svg class="ic flip-rtl"><use href="#i-chev"/></svg><span data-i18n="backHome"></span></button><button type="button" class="lang-btn" data-lang-toggle><svg class="ic"><use href="#i-globe"/></svg><span></span></button></div>
      <div class="auth-card">
        <div>
          <h2 data-i18n="welcome"></h2>
          <p class="muted" data-i18n="welcomeSub"></p>
        </div>
        <a class="btn google xl block" id="google-login" href="/api/auth/google" hidden><svg class="ic g"><use href="#i-google"/></svg><span data-i18n="continueGoogle"></span></a>
        <p class="muted small center" id="google-note" data-i18n="googleNote" hidden></p>
        <div class="divider" id="auth-divider" hidden><span data-i18n="orEmail"></span></div>
        <div class="seg" role="tablist">
          <button type="button" class="seg-btn active" data-auth="login" data-i18n="login"></button>
          <button type="button" class="seg-btn" data-auth="register" data-i18n="register"></button>
        </div>
        <form id="auth-form" class="stack" novalidate>
          <label class="field" data-only="register" hidden>
            <span data-i18n="name"></span>
            <input name="name" autocomplete="name" />
          </label>
          <label class="field">
            <span data-i18n="email"></span>
            <input name="email" type="email" dir="ltr" autocomplete="email" required />
          </label>
          <label class="field">
            <span data-i18n="password"></span>
            <input name="password" type="password" dir="ltr" autocomplete="current-password" minlength="8" required />
          </label>
          <p class="form-error" id="auth-error" role="alert"></p>
          <button class="btn primary block lg" type="submit" id="auth-submit"></button>
        </form>
      </div>
    </div>
  </section>

  <!-- ===== App ===== -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand"><img src="/icon.svg" alt="" width="34" height="34" /><span data-i18n="brand"></span></div>
      <button class="ask-btn" type="button" data-ask data-voice><svg class="ic"><use href="#i-mic"/></svg><span data-i18n="askZajel"></span></button>
      <nav class="side-nav">
        <button class="nav-item" data-view="calendar"><svg class="ic"><use href="#i-calendar"/></svg><span data-i18n="navCalendar"></span></button>
        <button class="nav-item" data-view="people"><svg class="ic"><use href="#i-users"/></svg><span data-i18n="navPeople"></span><span class="badge" data-badge="people" hidden></span></button>
        <button class="nav-item" data-view="settings"><svg class="ic"><use href="#i-settings"/></svg><span data-i18n="navSettings"></span></button>
      </nav>
      <div class="side-foot">
        <button type="button" class="lang-btn" data-lang-toggle><svg class="ic"><use href="#i-globe"/></svg><span></span></button>
      </div>
    </aside>

    <div class="main-col">
      <main>
        <!-- Calendar (home) -->
        <section class="view" id="view-calendar">
          <header class="cal-top">
            <div>
              <p class="eyebrow" id="hello"></p>
              <h1 id="cal-title"></h1>
            </div>
            <div class="cal-controls">
              <button class="icon-btn lg" id="cal-prev" data-i18n-aria="prevMonth"><svg class="ic flip-rtl"><use href="#i-chev"/></svg></button>
              <button class="btn ghost" id="cal-today" data-i18n="today"></button>
              <button class="icon-btn lg" id="cal-next" data-i18n-aria="nextMonth"><svg class="ic flip-rtl mirror"><use href="#i-chev"/></svg></button>
              <a class="icon-btn lg" href="/api/calendar.ics" download data-i18n-aria="exportCal" data-i18n-title="exportCal"><svg class="ic"><use href="#i-download"/></svg></a>
            </div>
          </header>
          <div id="briefing-card" hidden></div>
          <button class="ask-bar" type="button" data-ask>
            <span class="ask-orb" data-voice><svg class="ic"><use href="#i-mic"/></svg></span>
            <span class="ask-text"><strong data-i18n="askZajel"></strong><small data-i18n="askHint"></small></span>
          </button>
          <div id="invites" class="invites" hidden></div>
          <div class="calendar">
            <div class="cal-grid cal-week" id="cal-week"></div>
            <div class="cal-grid cal-days" id="cal-grid"></div>
          </div>
        </section>

        <!-- People -->
        <section class="view" id="view-people" hidden>
          <header class="page-head">
            <h1 data-i18n="navPeople"></h1>
            <button class="btn primary lg" id="connect-open"><svg class="ic"><use href="#i-user-plus"/></svg><span data-i18n="connect"></span></button>
          </header>
          <div id="connections" class="stack"></div>
          <div class="section-head" style="margin-top:8px">
            <h2 data-i18n="contactsTitle"></h2>
            <div class="row gap">
              <button class="btn ghost" id="people-import"><svg class="ic"><use href="#i-upload"/></svg><span data-i18n="importList"></span></button>
              <button class="btn ghost" id="people-add"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="addPerson"></span></button>
            </div>
          </div>
          <div id="people-list" class="stack"></div>
        </section>

        <!-- Settings -->
        <section class="view" id="view-settings" hidden>
          <header class="page-head"><h1 data-i18n="navSettings"></h1></header>
          <div class="settings-grid">
            <div class="card profile-card">
              <div class="avatar" id="acc-avatar"></div>
              <div class="grow">
                <p id="acc-name" class="strong"></p>
                <p id="acc-email" class="muted small" dir="ltr"></p>
              </div>
              <button class="btn ghost danger-text" id="logout"><svg class="ic"><use href="#i-logout"/></svg><span data-i18n="logout"></span></button>
            </div>
            <div class="card" id="briefing-settings"></div>
            <div class="card" id="gmail-card"></div>
            <div class="card" id="memory-card"></div>
            <div class="card" id="siri-card"></div>
            <div class="card">
              <h3 class="card-title" data-i18n="language"></h3>
              <div class="seg big" id="lang-seg">
                <button type="button" class="seg-btn" data-set-lang="ar">العربية</button>
                <button type="button" class="seg-btn" data-set-lang="en">English</button>
              </div>
            </div>
            <div class="card" id="plan-card"></div>
            <div class="card">
              <details class="history">
                <summary><span class="card-title row gap"><svg class="ic"><use href="#i-history"/></svg><span data-i18n="sentHistory"></span></span></summary>
                <ul class="email-list" id="email-list"></ul>
              </details>
            </div>
          </div>
        </section>
      </main>
    </div>

    <button class="fab" type="button" data-ask data-voice data-i18n-aria="askZajel"><svg class="ic"><use href="#i-mic"/></svg></button>

    <nav class="tabbar">
      <button class="tab" data-view="calendar"><svg class="ic"><use href="#i-calendar"/></svg><span data-i18n="navCalendar"></span></button>
      <button class="tab" data-view="people"><span class="tab-ic"><svg class="ic"><use href="#i-users"/></svg><span class="badge" data-badge="people" hidden></span></span><span data-i18n="navPeople"></span></button>
      <button class="tab" data-view="settings"><svg class="ic"><use href="#i-settings"/></svg><span data-i18n="navSettings"></span></button>
    </nav>
  </div>

  <!-- ===== Sheets ===== -->
  <div class="backdrop" id="backdrop" hidden></div>

  <!-- Ask Zajel -->
  <div class="sheet assistant" id="sheet-assistant" hidden role="dialog" aria-modal="true" aria-labelledby="as-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="as-title" class="row gap"><span class="ask-orb sm"><svg class="ic"><use href="#i-sparkle"/></svg></span><span data-i18n="brand"></span></h3>
      <div class="row" style="gap:2px">
        <button class="icon-btn lg" type="button" id="as-new" data-i18n-aria="newChat" data-i18n-title="newChat"><svg class="ic"><use href="#i-new-chat"/></svg></button>
        <button class="icon-btn lg" type="button" data-close data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="as-thread" id="as-thread"></div>
    <div class="as-examples" id="as-examples"></div>
    <div class="as-status" id="as-status" hidden aria-live="polite">
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span id="as-status-text"></span>
      <span class="as-timer" id="as-timer"></span>
    </div>
    <form class="as-bar" id="as-form">
      <button type="button" class="mic-btn" id="as-mic" data-i18n-aria="speak"><svg class="ic"><use href="#i-mic"/></svg><span class="spinner" aria-hidden="true"></span></button>
      <input id="as-input" autocomplete="off" enterkeyhint="send" data-i18n-ph="askPh" />
      <button type="button" class="speech-lang" id="as-speech-lang" data-i18n-aria="speechLang"></button>
      <button type="submit" class="go-btn" data-i18n-aria="sendCommand"><svg class="ic flip-rtl mirror"><use href="#i-arrow"/></svg></button>
    </form>
  </div>

  <!-- Day -->
  <div class="sheet" id="sheet-day" hidden role="dialog" aria-modal="true" aria-labelledby="day-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="day-title"></h3>
      <button class="icon-btn lg" type="button" data-close data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <ul class="task-list" id="day-meetings"></ul>
    <ul class="task-list" id="day-list"></ul>
    <button class="btn ghost lg" type="button" id="day-meeting"><svg class="ic"><use href="#i-meeting"/></svg><span data-i18n="newMeeting"></span></button>
    <form class="add-row" id="day-add">
      <input name="title" maxlength="200" data-i18n-ph="addTaskPh" required />
      <input name="time" type="time" class="time-input" />
      <button type="submit" class="go-btn" data-i18n-aria="add"><svg class="ic"><use href="#i-plus"/></svg></button>
    </form>
  </div>

  <!-- Task page -->
  <div class="sheet drawer" id="sheet-detail" hidden role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="detail-body"></div>
  </div>

  <!-- Confirm send (task drafts) -->
  <div class="sheet" id="sheet-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="confirm-title" data-i18n="confirmTitle"></h3>
      <button class="icon-btn lg" type="button" data-close data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="preview" id="confirm-preview"></div>
    <div class="row gap sheet-actions">
      <button type="button" class="btn ghost grow lg" data-back-detail data-i18n="editDraft"></button>
      <button type="button" class="btn primary grow lg" id="confirm-send"><svg class="ic"><use href="#i-send"/></svg><span data-i18n="sendNow"></span></button>
    </div>
  </div>

  <!-- Person -->
  <div class="sheet" id="sheet-person" hidden role="dialog" aria-modal="true" aria-labelledby="person-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="person-title"></h3>
      <button class="icon-btn lg" type="button" data-close data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <form id="person-form" class="stack">
      <label class="field"><span data-i18n="name"></span><input name="name" required maxlength="120" /></label>
      <label class="field"><span data-i18n="phoneLabel"></span><input name="phone" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="+974 5512 3456" /></label>
      <label class="field"><span data-i18n="emailOptional"></span><input name="email" type="email" dir="ltr" /></label>
      <label class="field"><span data-i18n="group"></span><input name="group" list="group-options" maxlength="60" data-i18n-ph="groupPh" /></label>
      <div class="row gap sheet-actions">
        <button type="button" class="btn ghost lg danger-text" id="person-delete" hidden><svg class="ic"><use href="#i-trash"/></svg></button>
        <button type="submit" class="btn primary grow lg" data-i18n="save"></button>
      </div>
    </form>
  </div>

  <!-- Import -->
  <div class="sheet" id="sheet-import" hidden role="dialog" aria-modal="true" aria-labelledby="import-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="import-title" data-i18n="importList"></h3>
      <button class="icon-btn lg" type="button" data-close data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <form id="import-form" class="stack">
      <label class="field"><span data-i18n="importHelp"></span><textarea name="text" rows="7" dir="ltr" placeholder="Sara Ahmed, sara@company.com, 5512 3456&#10;Omar Ali, +974 6611 2233&#10;Lina, lina@company.com"></textarea></label>
      <label class="field"><span data-i18n="group"></span><input name="group" list="group-options" maxlength="60" data-i18n-ph="groupPh" /></label>
      <button type="submit" class="btn primary block lg" data-i18n="importBtn"></button>
    </form>
  </div>

  <!-- Connect with a Zajel user -->
  <div class="sheet" id="sheet-connect" hidden role="dialog" aria-modal="true" aria-labelledby="connect-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="connect-title" data-i18n="connect"></h3>
      <button class="icon-btn lg" type="button" data-close data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <p class="muted" data-i18n="connectHelp"></p>
    <form id="connect-form" class="stack">
      <label class="field"><span data-i18n="email"></span><input name="email" type="email" dir="ltr" required /></label>
      <div id="connect-result"></div>
      <button type="submit" class="btn primary block lg" data-i18n="sendRequest"></button>
    </form>
  </div>

  <!-- Meeting details -->
  <div class="sheet" id="sheet-meeting" hidden role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="meeting-body"></div>
  </div>

  <!-- New meeting -->
  <div class="sheet" id="sheet-meeting-form" hidden role="dialog" aria-modal="true" aria-labelledby="mf-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="mf-title" data-i18n="newMeeting"></h3>
      <button class="icon-btn lg" type="button" data-close data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <form id="meeting-form" class="stack">
      <label class="field"><span data-i18n="meetingTitle"></span><input name="title" required maxlength="200" dir="auto" /></label>
      <div class="row gap wrap">
        <label class="field grow"><span data-i18n="fDate"></span><input name="date" type="date" required /></label>
        <label class="field grow"><span data-i18n="fTime"></span><input name="time" type="time" required /></label>
        <label class="field grow"><span data-i18n="duration"></span>
          <select name="durationMin">
            <option value="15">15</option><option value="30" selected>30</option><option value="45">45</option>
            <option value="60">60</option><option value="90">90</option><option value="120">120</option>
          </select>
        </label>
      </div>
      <div class="field"><span data-i18n="attendees"></span><div class="pick" id="mf-attendees"></div></div>
      <label class="field"><span data-i18n="location"></span><input name="location" maxlength="200" dir="auto" data-i18n-ph="locationPh" /></label>
      <label class="field"><span data-i18n="notesLabel"></span><textarea name="notes" rows="3" dir="auto"></textarea></label>
      <div id="mf-conflicts"></div>
      <button type="submit" class="btn primary block xl"><svg class="ic"><use href="#i-send"/></svg><span data-i18n="sendInvite"></span></button>
    </form>
  </div>

  <datalist id="group-options"></datalist>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
