<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="مُدير — مهامك ومواعيدك ورسائلك في مكان واحد. Mudir — tasks, calendar and AI-drafted email in one place." />
  <title>مُدير · Mudir</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Icon set -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m21.5 7.5-9.5 6-9.5-6"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M11 3.5l1.8 4.8 4.8 1.8-4.8 1.8L11 16.7l-1.8-4.8-4.8-1.8 4.8-1.8z"/><path d="M18.5 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M21.5 2.5 11 13"/><path d="M21.5 2.5 15 21.5l-4-8.5-8.5-4z"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.5L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><path d="m3 7.5 4.5 4 4.5-7 4.5 7 4.5-4-2 11.5H5z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></symbol>
      <symbol id="i-rows" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
      <symbol id="i-circle-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8a7 7 0 0 0 7 7z"/></symbol>
    </defs>
  </svg>

  <!-- ===== Auth ===== -->
  <section id="auth" class="auth" hidden>
    <div class="auth-hero">
      <div class="brand"><img src="/icon.svg" alt="" width="40" height="40" /><span data-i18n="brand"></span></div>
      <div class="hero-copy">
        <h1 data-i18n="heroTitle"></h1>
        <p data-i18n="heroText"></p>
        <ul class="hero-points">
          <li><span class="hp-icon"><svg class="ic"><use href="#i-calendar"/></svg></span><span data-i18n="heroP1"></span></li>
          <li><span class="hp-icon"><svg class="ic"><use href="#i-sparkle"/></svg></span><span data-i18n="heroP2"></span></li>
          <li><span class="hp-icon"><svg class="ic"><use href="#i-send"/></svg></span><span data-i18n="heroP3"></span></li>
        </ul>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-top"><button type="button" class="lang-btn" data-lang-toggle><svg class="ic"><use href="#i-globe"/></svg><span></span></button></div>
      <div class="auth-card">
        <div>
          <h2 data-i18n="welcome"></h2>
          <p class="muted" data-i18n="welcomeSub"></p>
        </div>
        <div class="seg" role="tablist">
          <button type="button" class="seg-btn active" data-auth="login" data-i18n="login"></button>
          <button type="button" class="seg-btn" data-auth="register" data-i18n="register"></button>
        </div>
        <form id="auth-form" class="stack" novalidate>
          <label class="field" data-only="register" hidden>
            <span data-i18n="name"></span>
            <input name="name" autocomplete="name" />
          </label>
          <label class="field">
            <span data-i18n="email"></span>
            <input name="email" type="email" dir="ltr" autocomplete="email" required />
          </label>
          <label class="field">
            <span data-i18n="password"></span>
            <input name="password" type="password" dir="ltr" autocomplete="current-password" minlength="8" required />
          </label>
          <p class="form-error" id="auth-error" role="alert"></p>
          <button class="btn primary block lg" type="submit" id="auth-submit"></button>
        </form>
      </div>
    </div>
  </section>

  <!-- ===== App ===== -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand"><img src="/icon.svg" alt="" width="34" height="34" /><span data-i18n="brand"></span></div>
      <button class="btn primary block" type="button" data-new-task><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="newTask"></span></button>
      <nav class="side-nav">
        <button class="nav-item" data-view="tasks"><svg class="ic"><use href="#i-list"/></svg><span data-i18n="navTasks"></span><span class="nav-count" id="nav-count"></span></button>
        <button class="nav-item" data-view="calendar"><svg class="ic"><use href="#i-calendar"/></svg><span data-i18n="navCalendar"></span></button>
        <button class="nav-item" data-view="emails"><svg class="ic"><use href="#i-mail"/></svg><span data-i18n="navEmails"></span></button>
        <button class="nav-item" data-view="account"><svg class="ic"><use href="#i-user"/></svg><span data-i18n="navAccount"></span></button>
      </nav>
      <div class="side-foot">
        <div class="plan-mini" id="plan-mini"></div>
        <button type="button" class="lang-btn" data-lang-toggle><svg class="ic"><use href="#i-globe"/></svg><span></span></button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-text">
          <p class="eyebrow" id="today-label"></p>
          <h1 id="hello"></h1>
        </div>
        <div class="topbar-actions">
          <button type="button" class="lang-btn compact" data-lang-toggle><svg class="ic"><use href="#i-globe"/></svg><span></span></button>
          <span class="plan-badge" id="plan-badge"></span>
        </div>
      </header>

      <main>
        <!-- Tasks -->
        <section class="view" id="view-tasks">
          <div class="stats" id="stats"></div>
          <div class="toolbar">
            <div class="chips" id="task-filters" role="tablist">
              <button class="chip active" data-filter="today" data-i18n="fToday"></button>
              <button class="chip" data-filter="upcoming" data-i18n="fUpcoming"></button>
              <button class="chip" data-filter="overdue" data-i18n="fOverdue"></button>
              <button class="chip" data-filter="all" data-i18n="fAll"></button>
              <button class="chip" data-filter="done" data-i18n="fDone"></button>
            </div>
            <div class="toolbar-actions">
              <label class="search">
                <svg class="ic"><use href="#i-search"/></svg>
                <input id="search" type="search" autocomplete="off" data-i18n-ph="searchPh" />
                <kbd class="kbd">Ctrl K</kbd>
              </label>
              <div class="seg mini" id="layout-seg">
                <button type="button" class="seg-btn" data-layout="list" data-i18n-aria="viewList"><svg class="ic"><use href="#i-rows"/></svg></button>
                <button type="button" class="seg-btn" data-layout="board" data-i18n-aria="viewBoard"><svg class="ic"><use href="#i-board"/></svg></button>
              </div>
              <button class="ai-btn" id="ai-plan-btn" type="button">
                <svg class="ic"><use href="#i-sparkle"/></svg>
                <span data-i18n="aiPlan"></span>
                <span class="pro-tag">PRO</span>
              </button>
            </div>
          </div>
          <div id="plan-result"></div>
          <ul class="task-list" id="task-list"></ul>
          <div class="board" id="board" hidden></div>
        </section>

        <!-- Calendar -->
        <section class="view" id="view-calendar" hidden>
          <div class="cal-layout">
            <div class="card cal-card">
              <div class="cal-head">
                <button class="icon-btn" id="cal-prev" data-i18n-aria="prevMonth"><svg class="ic flip-rtl"><use href="#i-chev"/></svg></button>
                <h2 id="cal-title"></h2>
                <button class="icon-btn" id="cal-next" data-i18n-aria="nextMonth"><svg class="ic flip-rtl mirror"><use href="#i-chev"/></svg></button>
              </div>
              <div class="cal-grid cal-week" id="cal-week"></div>
              <div class="cal-grid" id="cal-grid"></div>
            </div>
            <div class="cal-side">
              <div class="section-head">
                <h3 id="cal-day-title"></h3>
                <button class="btn ghost sm" id="cal-add"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="addForDay"></span></button>
              </div>
              <ul class="task-list" id="cal-day-list"></ul>
              <a class="btn ghost block" href="/api/calendar.ics" download><svg class="ic"><use href="#i-download"/></svg><span data-i18n="exportCal"></span></a>
              <p class="muted small center" data-i18n="exportNote"></p>
            </div>
          </div>
        </section>

        <!-- Emails -->
        <section class="view" id="view-emails" hidden>
          <div class="section-head"><h2 data-i18n="sentTitle"></h2></div>
          <ul class="email-list" id="email-list"></ul>
        </section>

        <!-- Account -->
        <section class="view" id="view-account" hidden>
          <div class="account-grid">
            <div class="card profile-card">
              <div class="avatar" id="acc-avatar"></div>
              <div class="grow">
                <p id="acc-name" class="strong"></p>
                <p id="acc-email" class="muted small" dir="ltr"></p>
              </div>
              <button class="btn ghost sm danger-text" id="logout"><svg class="ic"><use href="#i-logout"/></svg><span data-i18n="logout"></span></button>
            </div>
            <div class="card" id="gmail-card"></div>
            <div class="card" id="plan-card"></div>
            <div class="card">
              <h3 class="card-title" data-i18n="usageTitle"></h3>
              <div id="usage"></div>
            </div>
            <div class="card">
              <h3 class="card-title" data-i18n="language"></h3>
              <div class="seg" id="lang-seg">
                <button type="button" class="seg-btn" data-set-lang="ar">العربية</button>
                <button type="button" class="seg-btn" data-set-lang="en">English</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <button class="fab" type="button" data-new-task data-i18n-aria="newTask"><svg class="ic"><use href="#i-plus"/></svg></button>

    <nav class="tabbar">
      <button class="tab" data-view="tasks"><svg class="ic"><use href="#i-list"/></svg><span data-i18n="navTasks"></span></button>
      <button class="tab" data-view="calendar"><svg class="ic"><use href="#i-calendar"/></svg><span data-i18n="navCalendar"></span></button>
      <button class="tab" data-view="emails"><svg class="ic"><use href="#i-mail"/></svg><span data-i18n="navEmails"></span></button>
      <button class="tab" data-view="account"><svg class="ic"><use href="#i-user"/></svg><span data-i18n="navAccount"></span></button>
    </nav>
  </div>

  <!-- ===== Sheets ===== -->
  <div class="backdrop" id="backdrop" hidden></div>

  <div class="sheet" id="sheet-edit" hidden role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="edit-title"></h3>
      <button class="icon-btn sm" type="button" data-close data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <form id="edit-form" class="stack">
      <label class="field">
        <span data-i18n="fTitle"></span>
        <input name="title" required maxlength="200" data-i18n-ph="titlePh" />
      </label>
      <div class="row gap">
        <label class="field grow"><span data-i18n="fDate"></span><input name="date" type="date" /></label>
        <label class="field grow"><span data-i18n="fTime"></span><input name="time" type="time" /></label>
      </div>
      <div class="field">
        <span data-i18n="fPriority"></span>
        <div class="seg" id="prio-seg">
          <button type="button" class="seg-btn" data-prio="high"><i class="dot p-high"></i><span data-i18n="pHigh"></span></button>
          <button type="button" class="seg-btn active" data-prio="medium"><i class="dot p-medium"></i><span data-i18n="pMedium"></span></button>
          <button type="button" class="seg-btn" data-prio="low"><i class="dot p-low"></i><span data-i18n="pLow"></span></button>
        </div>
      </div>
      <label class="field">
        <span data-i18n="fNotes"></span>
        <textarea name="notes" rows="3" data-i18n-ph="notesPh"></textarea>
      </label>
      <div class="row gap wrap">
        <label class="field grow"><span data-i18n="fContactName"></span><input name="contactName" /></label>
        <label class="field grow"><span data-i18n="fContactEmail"></span><input name="contactEmail" type="email" dir="ltr" /></label>
      </div>
      <div class="row gap sheet-actions">
        <button type="button" class="btn ghost grow" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn primary grow" data-i18n="save"></button>
      </div>
    </form>
  </div>

  <div class="sheet drawer" id="sheet-detail" hidden role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="detail-body"></div>
  </div>

  <div class="sheet" id="sheet-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="confirm-title" data-i18n="confirmTitle"></h3>
      <button class="icon-btn sm" type="button" data-close data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="preview" id="confirm-preview"></div>
    <div class="row gap sheet-actions">
      <button type="button" class="btn ghost grow" data-back-detail data-i18n="editDraft"></button>
      <button type="button" class="btn primary grow" id="confirm-send"><svg class="ic"><use href="#i-send"/></svg><span data-i18n="sendNow"></span></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
